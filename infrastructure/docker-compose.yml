name: epa-auth-lab

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: 'true'
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_DEFAULT_REDIRECT_URI: ${OIDC_DEFAULT_REDIRECT_URI:?Set OIDC_DEFAULT_REDIRECT_URI}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?Set TEST_USER_PASSWORD}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/epa-demo-realm.json:/opt/keycloak/data/import/epa-demo-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

volumes:
  keycloak-data:
