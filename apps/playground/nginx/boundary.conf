if ($playground_operation = static) { return 404; }
if ($playground_method_allowed = 0) { return 405; }
if ($playground_trusted_ingress = 0) { return 403; }
if ($playground_edge_https = 0) { return 403; }
if ($http_host != auth-playground.yappai.de) { return 403; }
if ($remote_addr = $realip_remote_addr) { return 403; }

# limit_req inherits only when a location declares none. Keep the aggregate cap
# alongside every operation's local budget rather than losing it at that boundary.
limit_req zone=playground_aggregate burst=60 nodelay;

proxy_http_version 1.1;
proxy_set_header Host auth-playground.yappai.de;
proxy_set_header X-Forwarded-Host auth-playground.yappai.de;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header Connection "";
proxy_set_header CF-Connecting-IP "";
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_buffering off;
proxy_redirect off;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_send_timeout 10s;
