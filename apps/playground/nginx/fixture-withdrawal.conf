log_format fixture_safe escape=json '{"status":$status,"duration":$request_time}';
server {
  listen 80;
  server_name auth-playground.yappai.de;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout fixture_safe;
  error_log /dev/null;
  add_header X-Content-Type-Options nosniff always;
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  # Late callbacks must neither reach a backend nor enter the old URL access log.
  location ~ ^/(api|realms|resources|admin|actuator|fhir|mcp)(/|$) {
    add_header Cache-Control no-store always;
    return 404;
  }
  location = /index.html { expires -1; }
  location /assets/ { try_files $uri =404; expires 1h; }
  location / { try_files $uri $uri/ /index.html; }
}
