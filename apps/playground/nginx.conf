server {
  listen 80;
  server_name auth-playground.yappai.de;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    expires -1;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
